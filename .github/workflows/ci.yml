name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Must be lowercase for the Docker registry.
  IMAGE_PREFIX: etqan-agency/chatbot-zaychain

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # dorny/paths-filter calls the GitHub API to list a pull request's changed
    # files, which needs pull-requests: read on top of the workflow's
    # contents: read default -- without it the API call 403s.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'chabot_dev_api'
            dashboard:
              - 'chabot_dev_dash'
            infra:
              - 'docker-compose.production.yml'
              - 'traefik/**'
              - 'media/**'
              - 'scripts/**'
              - '.github/workflows/**'

  api-lint:
    name: API Linting
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pre-commit
      - name: Run pre-commit
        working-directory: chabot_dev_api
        run: pre-commit run --all-files

  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'push'
    services:
      # Tests run against the production engine. SQLite never exercises the
      # pgvector retrieval path, which is precisely the code a regression
      # would hide in.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: chatbot_test
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chatbot:chatbot@localhost:5432/chatbot_test
      SECRET_KEY: ci-only-not-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        working-directory: chabot_dev_api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check for missing migrations
        working-directory: chabot_dev_api
        run: python manage.py makemigrations --check --dry-run
      - name: Run migrations
        working-directory: chabot_dev_api
        run: python manage.py migrate --noinput
      - name: Run tests
        working-directory: chabot_dev_api
        run: python manage.py test

  dashboard-checks:
    name: Dashboard Lint, Types and Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: chabot_dev_dash/package-lock.json
      - name: Install dependencies
        working-directory: chabot_dev_dash
        run: npm ci
      - name: Lint
        working-directory: chabot_dev_dash
        run: npm run lint
      - name: Type check
        working-directory: chabot_dev_dash
        run: npx tsc --noEmit
      - name: Build
        working-directory: chabot_dev_dash
        run: npm run build

  infra-lint:
    name: Infra Linting
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        # Pinned, not `apt-get install shellcheck`. Ubuntu's package is 0.9.0
        # while a developer's local install is typically the current release,
        # and the two disagree: 0.9.0 reports SC2015 inside a command
        # substitution where 0.11.0 does not. That divergence turned "shellcheck
        # clean locally" into a claim CI could still reject -- which is exactly
        # what happened on this job's first real run. Pin it so local and CI
        # can only ever agree, and bump this deliberately.
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep '^version:' 

      - name: Shellcheck
        # -x follows `source` directives so lib/ is analysed in context, which
        # is the only way the deploy scripts' use of rollout.sh functions is
        # checked at all.
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh

      - name: Install actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest /usr/local/bin

      - name: Actionlint
        # Lints EVERY workflow, including ci.yml itself, and runs shellcheck
        # over every `run:` block. ci.yml's own summary step had to be brought
        # up to that standard first -- a gate that fails on its first run is
        # not a gate, it is a broken build everyone learns to ignore.
        run: actionlint

      - name: Validate the compose file renders
        # Catches a malformed label or an unbalanced quote before it reaches the
        # server, where the same error aborts a deploy mid-rollout.
        #
        # `cp .env.example .env`, NOT `touch .env`. `web` and `worker` declare
        # `env_file: .env` and .env is gitignored, so a clean checkout has none
        # and compose hard-errors ("env file ... not found") before it renders
        # anything -- this step would fail on every run.
        #
        # Copying the example rather than creating an empty file also lets the
        # step prove that .env.example is SUFFICIENT to render the compose file,
        # so the two cannot drift. An empty .env would satisfy compose and prove
        # nothing.
        #
        # That second guarantee needs the warning check below to be real.
        # `compose config` treats an undefined interpolation as a WARNING --
        # "The \"DOMAIN\" variable is not set. Defaulting to a blank string." --
        # and still EXITS 0. Measured: deleting DOMAIN= from .env.example
        # printed that warning four times and exited 0. Only ONE variable in
        # docker-compose.production.yml carries a `${VAR:?}` guard
        # (POSTGRES_PASSWORD), so without this check an exit-status-only step
        # could not catch an undocumented variable at all, and the claim above
        # would be false. A blank hostname, port or path renders "successfully"
        # here and reaches the server the same way.
        #
        # DOMAIN is deliberately NOT in `env:` -- it comes from the copied
        # .env.example, which is the point. POSTGRES_PASSWORD stays, because
        # .env.example ships it EMPTY on purpose (it is a secret filled in at
        # provisioning) and the compose file guards it with
        # `${POSTGRES_PASSWORD:?...}`, which rejects empty as well as unset.
        env:
          POSTGRES_PASSWORD: ci-render-only
        run: |
          cp .env.example .env

          # 2>&1 >/dev/null: send stderr to the capture, then discard the
          # rendered YAML. `if !` rather than a bare call so a hard render
          # error still prints compose's own diagnostic before failing.
          if ! render_stderr=$(docker compose -f docker-compose.production.yml config 2>&1 >/dev/null); then
            printf '%s\n' "${render_stderr}" >&2
            echo "ERROR: docker-compose.production.yml does not render." >&2
            exit 1
          fi

          # A here-string, NOT `printf ... | grep`. Under `set -o pipefail`
          # (which Actions sets for every run: block) grep -q exits on its
          # first match, printf takes SIGPIPE, and the pipeline reports 141 --
          # so the check would silently never fire on the very input it exists
          # to catch.
          if grep -q 'variable is not set' <<< "${render_stderr}"; then
            printf '%s\n' "${render_stderr}" >&2
            echo "ERROR: the compose file interpolates a variable that .env.example" >&2
            echo "       does not define. Compose defaults it to a blank string and" >&2
            echo "       still exits 0, so this renders 'successfully' with an empty" >&2
            echo "       hostname, port or path -- and the same blank would reach the" >&2
            echo "       server, where it is a mid-deploy failure instead." >&2
            echo "       Add the variable to .env.example, or give it a default in" >&2
            echo "       docker-compose.production.yml." >&2
            exit 1
          fi

          echo "compose renders, and .env.example defines every variable it interpolates"

  rollout-tests:
    name: Rollout Primitive Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Run the rollout test suite
        # Stubs `docker` on PATH; touches no daemon and no network.
        run: bash scripts/lib/rollout.test.sh

  infra-e2e:
    name: Deploy/Rollback Rehearsal
    runs-on: ubuntu-latest
    needs: [changes]
    # Same gate as infra-lint and rollout-tests: this exercises the deploy
    # scripts, the compose topology and the gateway configuration, none of
    # which an application-only change can affect.
    if: needs.changes.outputs.infra == 'true'
    # The rehearsal runs three rolls, each of which waits out a drain settle
    # window and two health gates. 25 minutes is roughly 3x the observed run
    # and exists to kill a hang, not to bound normal work -- a rollout that
    # deadlocks would otherwise hold a runner for the full 6h default.
    timeout-minutes: 25
    steps:
      # No `submodules: recursive` and no SUBMODULE_TOKEN. The rehearsal builds
      # its own stand-in images (scripts/e2e/*-standin) and tags them as the
      # real ones, so the compose file runs unmodified without either component
      # repo being present. That is deliberate: an infra gate that needed the
      # submodules would fail on a submodule outage, and would re-run whenever
      # application code changed for reasons this job cannot detect.
      - uses: actions/checkout@v4

      - name: Run the deploy/rollback rehearsal
        # --fast shortens the drain settle window to 7s. That is still longer
        # than Traefik's 5s healthcheck interval, so a drained backend is
        # genuinely observed leaving the pool; the assertions are unchanged.
        run: bash scripts/e2e.sh --fast

      - name: Gateway and deploy logs on failure
        if: failure()
        # The rehearsal tears itself down on exit, so anything not printed by
        # then is gone. This is a last resort for a failure that happened
        # before the script's own diagnostics ran.
        run: |
          docker ps -a || true
          docker logs chatbot-e2e-edge 2>&1 | tail -50 || true

  build-api:
    name: Build and Push API Image
    runs-on: ubuntu-latest
    needs: [api-lint, api-test]
    # Both images must exist at EVERY main SHA: cd.yml deploys one tag for the
    # whole stack, and a release PR usually bumps a single component's pointer.
    #
    # Today api-lint and api-test also carry `|| github.event_name == 'push'`,
    # so they do not skip on a push and this job would run regardless. This
    # condition makes that guarantee local instead of inherited: without it,
    # removing that clause upstream (a plausible way to stop re-running checks
    # for an unchanged component) would silently skip this build, and the first
    # symptom would be verify-images failing in CD with no image at that SHA.
    #
    # `!= 'failure'` and not `== 'success'`: 'skipped' must pass, while a
    # genuine lint or test failure must still block. The layer cache makes an
    # unchanged rebuild cheap.
    #
    # always() && !cancelled(): always() alone would also run this job when the
    # workflow run is cancelled; !cancelled() excludes that case. The two are
    # partly redundant (!cancelled() alone implies everything always() adds
    # except running on cancellation), but always() is kept explicit here so
    # the intent -- "run regardless of needs' skip/success status" -- reads
    # directly off the condition rather than through cancelled()'s negation.
    if: >-
      always() && !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.api-lint.result != 'failure' && needs.api-test.result != 'failure'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./chabot_dev_api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          provenance: true
          sbom: true

  build-dashboard:
    name: Build and Push Dashboard Image
    runs-on: ubuntu-latest
    needs: [dashboard-checks]
    # Same shape as build-api's if -- see the comment there for why.
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.dashboard-checks.result != 'failure'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/dashboard
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./chabot_dev_dash
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max
          provenance: true
          sbom: true

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-api, build-dashboard, infra-lint, rollout-tests, infra-e2e]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Summarise
        run: |
          {
            echo "## CI Pipeline Summary"
            echo ""
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| API | ${{ needs.build-api.result }} |"
            echo "| Dashboard | ${{ needs.build-dashboard.result }} |"
            echo "| Infra lint | ${{ needs.infra-lint.result }} |"
            echo "| Rollout tests | ${{ needs.rollout-tests.result }} |"
            echo "| Deploy rehearsal | ${{ needs.infra-e2e.result }} |"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any build failed
        if: needs.build-api.result != 'success' || needs.build-dashboard.result != 'success'
        run: exit 1
      - name: Fail if infra checks failed
        # skipped counts as passing here: infra-lint and rollout-tests do not
        # run on an API-only or dashboard-only change, and treating that skip
        # as a failure would block every such PR.
        run: |
          if [ "${{ needs.infra-lint.result }}" != "success" ] && \
             [ "${{ needs.infra-lint.result }}" != "skipped" ]; then
            echo "Infra linting failed"; exit 1
          fi
          if [ "${{ needs.rollout-tests.result }}" != "success" ] && \
             [ "${{ needs.rollout-tests.result }}" != "skipped" ]; then
            echo "Rollout primitive tests failed"; exit 1
          fi
          if [ "${{ needs.infra-e2e.result }}" != "success" ] && \
             [ "${{ needs.infra-e2e.result }}" != "skipped" ]; then
            echo "Deploy/rollback rehearsal failed"; exit 1
          fi
