name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Must be lowercase for the Docker registry.
  IMAGE_PREFIX: etqan-agency/chatbot

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # dorny/paths-filter calls the GitHub API to list a pull request's changed
    # files, which needs pull-requests: read on top of the workflow's
    # contents: read default -- without it the API call 403s.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'chatbot_api'
            dashboard:
              - 'chatbot_dashboard'
            infra:
              - 'docker-compose.production.yml'
              - 'traefik/**'
              - 'media/**'
              - 'scripts/**'
              - '.github/workflows/**'

  api-lint:
    name: API Linting
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pre-commit
      - name: Run pre-commit
        working-directory: chatbot_api
        run: pre-commit run --all-files

  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'push'
    services:
      # Tests run against the production engine. SQLite never exercises the
      # pgvector retrieval path, which is precisely the code a regression
      # would hide in.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: chatbot_test
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chatbot:chatbot@localhost:5432/chatbot_test
      SECRET_KEY: ci-only-not-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        working-directory: chatbot_api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check for missing migrations
        working-directory: chatbot_api
        run: python manage.py makemigrations --check --dry-run
      - name: Run migrations
        working-directory: chatbot_api
        run: python manage.py migrate --noinput
      - name: Run tests
        working-directory: chatbot_api
        run: python manage.py test

  dashboard-checks:
    name: Dashboard Lint, Types and Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: chatbot_dashboard/package-lock.json
      - name: Install dependencies
        working-directory: chatbot_dashboard
        run: npm ci
      - name: Lint
        working-directory: chatbot_dashboard
        run: npm run lint
      - name: Type check
        working-directory: chatbot_dashboard
        run: npx tsc --noEmit
      - name: Build
        working-directory: chatbot_dashboard
        run: npm run build

  infra-lint:
    name: Infra Linting
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck
        # -x follows `source` directives so lib/ is analysed in context, which
        # is the only way the deploy scripts' use of rollout.sh functions is
        # checked at all.
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh

      - name: Install actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest /usr/local/bin

      - name: Actionlint
        # Lints EVERY workflow, including ci.yml itself, and runs shellcheck
        # over every `run:` block. ci.yml's own summary step had to be brought
        # up to that standard first -- a gate that fails on its first run is
        # not a gate, it is a broken build everyone learns to ignore.
        run: actionlint

      - name: Validate the compose file renders
        # Catches a malformed label or an unbalanced quote before it reaches the
        # server, where the same error aborts a deploy mid-rollout.
        env:
          DOMAIN: example.com
          POSTGRES_PASSWORD: ci-render-only
        run: docker compose -f docker-compose.production.yml config > /dev/null

  rollout-tests:
    name: Rollout Primitive Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Run the rollout test suite
        # Stubs `docker` on PATH; touches no daemon and no network.
        run: bash scripts/lib/rollout.test.sh

  build-api:
    name: Build and Push API Image
    runs-on: ubuntu-latest
    needs: [api-lint, api-test]
    # Both images must exist at EVERY main SHA: cd.yml deploys one tag for the
    # whole stack, and a release PR usually bumps a single component's pointer.
    #
    # Today api-lint and api-test also carry `|| github.event_name == 'push'`,
    # so they do not skip on a push and this job would run regardless. This
    # condition makes that guarantee local instead of inherited: without it,
    # removing that clause upstream (a plausible way to stop re-running checks
    # for an unchanged component) would silently skip this build, and the first
    # symptom would be verify-images failing in CD with no image at that SHA.
    #
    # `!= 'failure'` and not `== 'success'`: 'skipped' must pass, while a
    # genuine lint or test failure must still block. The layer cache makes an
    # unchanged rebuild cheap.
    #
    # always() && !cancelled(): always() alone would also run this job when the
    # workflow run is cancelled; !cancelled() excludes that case. The two are
    # partly redundant (!cancelled() alone implies everything always() adds
    # except running on cancellation), but always() is kept explicit here so
    # the intent -- "run regardless of needs' skip/success status" -- reads
    # directly off the condition rather than through cancelled()'s negation.
    if: >-
      always() && !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.api-lint.result != 'failure' && needs.api-test.result != 'failure'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./chatbot_api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          provenance: true
          sbom: true

  build-dashboard:
    name: Build and Push Dashboard Image
    runs-on: ubuntu-latest
    needs: [dashboard-checks]
    # Same shape as build-api's if -- see the comment there for why.
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.dashboard-checks.result != 'failure'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/dashboard
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./chatbot_dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max
          provenance: true
          sbom: true

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-api, build-dashboard, infra-lint, rollout-tests]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Summarise
        run: |
          {
            echo "## CI Pipeline Summary"
            echo ""
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| API | ${{ needs.build-api.result }} |"
            echo "| Dashboard | ${{ needs.build-dashboard.result }} |"
            echo "| Infra lint | ${{ needs.infra-lint.result }} |"
            echo "| Rollout tests | ${{ needs.rollout-tests.result }} |"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any build failed
        if: needs.build-api.result != 'success' || needs.build-dashboard.result != 'success'
        run: exit 1
      - name: Fail if infra checks failed
        # skipped counts as passing here: infra-lint and rollout-tests do not
        # run on an API-only or dashboard-only change, and treating that skip
        # as a failure would block every such PR.
        run: |
          if [ "${{ needs.infra-lint.result }}" != "success" ] && \
             [ "${{ needs.infra-lint.result }}" != "skipped" ]; then
            echo "Infra linting failed"; exit 1
          fi
          if [ "${{ needs.rollout-tests.result }}" != "success" ] && \
             [ "${{ needs.rollout-tests.result }}" != "skipped" ]; then
            echo "Rollout primitive tests failed"; exit 1
          fi
