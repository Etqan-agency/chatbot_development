log:
  level: INFO

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  bufferingSize: 100
  filters:
    statusCodes:
      - "200-599"
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Content-Type: keep
        # The INBOUND header, which on this topology is client-supplied and
        # therefore untrusted -- Traefik is the edge and overwrites it before
        # forwarding (see the `web` entrypoint). It is kept because a request
        # arriving with an XFF it has no business setting is a useful signal,
        # not because it identifies anyone. The real peer address is the
        # ClientAddr/ClientHost field, which defaultMode: keep already logs;
        # read that one during an incident.
        X-Forwarded-For: keep

entryPoints:
  # Traefik is the edge. This is published on 0.0.0.0:80 and faces the public
  # internet directly -- there is no nginx in front of it on this topology.
  #
  # There is deliberately NO `forwardedHeaders.trustedIPs` block here, and
  # adding one is a security change, not a tuning knob. With no trusted
  # sources configured, Traefik OVERWRITES X-Forwarded-* on every inbound
  # request, which is the only correct behaviour for a process that terminates
  # client connections itself: there is no upstream proxy whose word could be
  # taken for the client's address.
  #
  # This inverts the previous topology, where nginx sat in front and its hop
  # HAD to be trusted. Anyone restoring a trustedIPs block here from that
  # history re-opens it: X-Forwarded-For becomes attacker-controlled, and the
  # rate limiters in dynamic/middlewares.yml key tenant identity off exactly
  # that header. See the matching note there -- the two settings are one
  # decision and must not be changed independently.
  web:
    address: ":80"
    # Everything public is https. The ACME HTTP-01 challenge still works
    # through this redirect: Traefik installs the challenge handler on this
    # entrypoint at a HIGHER priority than the redirection router, so
    # /.well-known/acme-challenge/ is answered here and everything else is
    # bounced. That ordering is what makes redirect + httpChallenge on the
    # same entrypoint a supported combination rather than a deadlock.
    #
    # The previous topology forbade this redirect outright, because a redirect
    # behind nginx bounced nginx's own proxied request back to nginx in an
    # infinite loop. That reasoning died with the nginx layer; it is recorded
    # here only so the old comment is not reinstated from git history.
    http:
      redirections:
        entryPoint:
          to: web-secure
          scheme: https
          permanent: true

  # The public TLS entrypoint. Certificates are resolved here rather than per
  # router: a router that forgets `tls.certresolver` on a per-router setup
  # still matches and still serves, just over a default self-signed
  # certificate -- a browser warning in production that no deploy-time check
  # catches. Setting it on the entrypoint makes it structurally impossible to
  # forget when adding a route.
  web-secure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
    transport:
      respondingTimeouts:
        # Carried over from the nginx vhosts' proxy_read_timeout /
        # proxy_send_timeout, which were 120s. Traefik's own defaults are not
        # the same (writeTimeout and readTimeout default to 0 = no timeout),
        # so dropping the nginx layer without restating these silently removes
        # the ceiling on a slow or stuck request.
        readTimeout: 120s
        writeTimeout: 120s
        idleTimeout: 180s

  # Container-local ONLY. Traefik's API exposes the entire routing
  # configuration, so this must never bind 0.0.0.0 or be published: binding
  # 127.0.0.1 means only a process inside this container's network namespace
  # (i.e. `docker exec`) can read it.
  traefik:
    address: "127.0.0.1:8080"

# Read-only view of the live routing configuration. Plan 3's rolling deploy
# queries /api/http/services/<name>@docker to learn whether Traefik considers a
# new replica UP, rather than inferring it from container health and a timer.
api:
  dashboard: false
  insecure: true

# LIVE. Traefik owns 80/443 and issues its own certificates; there is no
# certbot on the host. Issuance is on-demand and driven by the routers' Host()
# rules -- no `domains` are declared here, so adding a hostname is a router
# label and nothing else.
#
# `storage` is inside the traefik_acme volume, which is what makes issuance
# survive a gateway recreate. Lose that volume and every certificate is
# re-requested on the next start, against a rate limit that does not forgive
# it (below).
#
# The email is per-deployment and MUST be changed by each fork. It is set here
# rather than through an environment variable on purpose: Traefik's static
# configuration comes from a file OR from environment variables OR from CLI
# flags, and mixing them is not a documented merge. This file is the single
# source, so nothing silently half-applies.
#
# WHEN TESTING, POINT caServer AT LET'S ENCRYPT STAGING by editing this file
# (scripts/e2e.sh does exactly that to its own throwaway copy). The production
# CA allows 5 failed authorisations per account per hostname per hour, and a
# misconfigured DNS record or an unreachable :80 burns through that in one
# sitting -- after which the host cannot get a certificate for the rest of the
# hour no matter what you fix:
#
#   caServer: https://acme-staging-v02.api.letsencrypt.org/directory
#
# NOTE that the line above is a COMMENT, and a bare `grep caServer:` matches it.
# Anything scripting the staging switch must anchor to the config key or it will
# conclude the override is already applied and silently skip it -- which means
# running against the PRODUCTION CA while believing otherwise:
#
#   grep -E '^\s+caServer:' traefik/traefik.yml
#
# Measured, not theorised: that exact mistake was made while provisioning the
# first host on this topology.
certificatesResolvers:
  letsencrypt:
    acme:
      email: etqan.agency.company@gmail.com
      storage: /etc/traefik/acme/acme.json
      # HTTP-01, not TLS-ALPN-01 or DNS-01: it needs only a publicly reachable
      # :80, which this topology already requires for the https redirect. See
      # the `web` entrypoint for why the redirect does not swallow the
      # challenge.
      httpChallenge:
        entryPoint: web

providers:
  # Dynamic config lives in its own directory and hot-reloads. Pointing this at
  # a single file (or at traefik.yml itself) means every routing change needs a
  # full Traefik restart.
  file:
    directory: /etc/traefik/dynamic
    watch: true

  # Routers and services also come from container labels, so replicas are
  # discovered as they start and retired as they stop. Nothing is exposed
  # unless it opts in with `traefik.enable=true`.
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: chatbot_default
    # TWO constraints, for two different failure modes.
    #
    # oneoff=False: defence in depth behind the `-l traefik.enable=false` flag
    # deploy.sh puts on one-off containers. A `docker compose run` container
    # inherits its service's labels; without this it registers as an extra
    # backend with nothing listening. Ordinary compose containers carry
    # oneoff=False, so this matches them and excludes only one-offs.
    #
    # project=chatbot: the socket proxy exposes the WHOLE daemon, so this
    # provider sees every container on the host, not just this stack's.
    # `exposedByDefault: false` is not enough -- it only ignores containers
    # with no traefik labels. Another Traefik-labelled stack on the same host
    # is discovered in full, and Traefik requires a router (or service) name to
    # have ONE definition across every container declaring it: two stacks that
    # both name a router `api` make Traefik DISCARD it, and the host 404s. The
    # names in this file are the generic ones (`api`, `app`, `web`,
    # `dashboard`), so the collision is likely rather than exotic.
    #
    # Measured, not theorised: a second compose project on this developer's
    # machine declared `traefik.http.routers.api.rule` and
    # `traefik.http.routers.app.rule`, and BOTH of this stack's routers
    # vanished from `/api/http/routers` -- every request 404ing, with nothing
    # in the logs naming a cause. That is the same mechanism
    # assert_service_labels guards against WITHIN a rollout; this guards it
    # ACROSS projects, which no deploy-time check can see.
    #
    # `chatbot` must stay in step with the `name:` pinned at the top of
    # docker-compose.production.yml -- the label is what compose derives from
    # it. A production host runs one stack and is unaffected either way; this
    # is what makes the local rehearsal (scripts/e2e.sh) and any co-tenancy
    # safe.
    constraints: "Label(`com.docker.compose.oneoff`,`False`) && Label(`com.docker.compose.project`,`chatbot`)"
