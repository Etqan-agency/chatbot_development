http:
  middlewares:
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        # There is deliberately NO `forceSTSHeader` here. Traefik emits
        # Strict-Transport-Security only for a request it considers TLS, and
        # on this topology it terminates TLS itself, so the sts* settings
        # above apply natively.
        #
        # The previous topology needed forceSTSHeader because TLS ended at the
        # host nginx and every request reaching Traefik was plain http on a
        # loopback entrypoint -- without it the sts* settings were silently
        # inert. Restoring it here is not merely redundant: it would emit HSTS
        # on the :80 redirect response too, i.e. over cleartext, which is
        # exactly what the spec says to ignore.
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"

    # Replaces the nginx vhosts' `client_max_body_size 25M`. Traefik imposes NO
    # request body limit of its own, so without this middleware dropping the
    # nginx layer silently turns a 25 MB ceiling into an unlimited one, and the
    # first symptom is a worker OOM rather than a 413.
    #
    # 26214400 = 25 * 1024 * 1024, matching the old vhosts exactly.
    #
    # CAVEAT, and it is why this is applied to the api router only rather than
    # globally: `buffering` reads the whole request body before forwarding it
    # (spilling past memRequestBodyBytes to disk). nginx rejected an oversized
    # body from the declared Content-Length without reading it. Streaming
    # request bodies therefore behave differently here, and any route that
    # streams a RESPONSE must be checked against this middleware before it is
    # widened -- see docs/DEPLOY.md.
    body-limit:
      buffering:
        maxRequestBodyBytes: 26214400
        memRequestBodyBytes: 1048576

    # The API is called by tenants' own integrations as well as the dashboard,
    # so this is a coarse abuse guard only. Per-tenant limits are enforced in
    # the application (knowledge/services/quota.py), which is the layer that
    # knows who the caller is.
    rate-limit-api:
      rateLimit:
        average: 50
        burst: 100
        period: 1s
        # There is deliberately NO `sourceCriterion` here, and adding one is a
        # SECURITY change rather than a tuning knob. The default criterion is
        # the connecting peer's real address, which on this topology is the
        # client itself -- Traefik is the edge.
        #
        # The previous topology set sourceCriterion.ipStrategy.excludedIPs to
        # walk X-Forwarded-For and skip nginx's trusted hop. That was correct
        # ONLY because a trusted proxy sat in front and rewrote the header.
        # Here nothing does: X-Forwarded-For is whatever the caller chose to
        # send. Restoring that block from git history would let any caller
        # forge XFF to escape its own rate-limit bucket or poison another
        # tenant's, with nothing in the logs naming a cause.
        #
        # This pairs with the absent forwardedHeaders.trustedIPs in
        # traefik.yml. The two are ONE decision; changing either alone
        # produces a configuration that looks deliberate and is wrong.

    # Static asset serving; the limit exists to blunt scrapers, not to shape
    # normal use.
    rate-limit-static:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
        # See rate-limit-api: no sourceCriterion, for the same reason.
