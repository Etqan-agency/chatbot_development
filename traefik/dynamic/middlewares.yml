http:
  middlewares:
    # Django builds absolute URLs and validates CSRF against the forwarded
    # scheme. Behind TLS termination it would otherwise see plain http.
    csrf-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"

    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        # Traefik emits Strict-Transport-Security only for a request it
        # considers TLS -- and on this topology TLS terminates at the host
        # nginx, so every request reaching Traefik is plain http on the
        # loopback `web` entrypoint. Without this, the sts* settings above are
        # silently inert and NO route gets HSTS. forceSTSHeader emits it
        # regardless. The connection is still TLS end-to-end from the client's
        # point of view: nginx is what the browser talks to.
        forceSTSHeader: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"

    # The API is called by tenants' own integrations as well as the dashboard,
    # so this is a coarse abuse guard only. Per-tenant limits are enforced in
    # the application (knowledge/services/quota.py), which is the layer that
    # knows who the caller is.
    rate-limit-api:
      rateLimit:
        average: 50
        burst: 100
        period: 1s
        # Behind a proxy, the default source criterion is the connecting
        # address -- which is nginx, for every request. That silently turns a
        # per-client limit into one 50 req/s bucket shared by every tenant.
        #
        # excludedIPs (not depth): walks X-Forwarded-For from the right and
        # returns the first entry that is NOT one of these trusted-proxy
        # addresses, so nginx's own hop (added by $proxy_add_x_forwarded_for)
        # is skipped and a client cannot displace it by sending its own XFF.
        # depth:1 would do the same on the happy path, but on ANY request that
        # reaches Traefik without an X-Forwarded-For at all (misconfigured
        # vhost, or something reaching this entrypoint without traversing
        # nginx) depth yields an empty source and collapses every such
        # request into one bucket -- silently, and permanently, since nothing
        # about it looks like an error. excludedIPs degrades instead: with no
        # XFF to walk, it falls back to the connecting peer (nginx), so
        # degraded-path traffic buckets under nginx's own address rather than
        # an empty one. Same trusted addresses as traefik.yml's
        # forwardedHeaders.trustedIPs, so the two settings cannot disagree.
        sourceCriterion:
          ipStrategy:
            excludedIPs:
              - "127.0.0.1/32"
              - "172.18.0.1/32"

    # Static asset serving; the limit exists to blunt scrapers, not to shape
    # normal use.
    rate-limit-static:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
        # See rate-limit-api's comment: excludedIPs, not depth, so a request
        # missing X-Forwarded-For degrades to nginx's own bucket instead of
        # collapsing into one shared empty-source bucket for everyone.
        sourceCriterion:
          ipStrategy:
            excludedIPs:
              - "127.0.0.1/32"
              - "172.18.0.1/32"
