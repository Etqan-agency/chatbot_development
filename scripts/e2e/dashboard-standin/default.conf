# Stand-in for the dashboard's internal nginx.
#
# This MIRRORS the shape of chatbot_dashboard/docker/nginx.conf rather than
# being a copy of it. The copy would be the more faithful test, but it would
# also make this infra rehearsal fail whenever the dashboard repo edits its own
# vhost -- coupling an infra gate to a submodule's content, for a file that
# submodule's CI already owns. What this rehearsal must prove is the topology
# around the dashboard: that Traefik host-routes to it, that it can reach
# `web` and `media` over Docker DNS with a re-resolving proxy_pass, and that
# rolling it keeps serving. Those need the shape, not the byte-for-byte file.
server {
    listen 80;
    server_name _;

    # Both are load-bearing for the SPA fallback below. Without `root`, nginx
    # uses its compiled-in default (which does not exist in this image),
    # try_files' /index.html fallback re-enters `location /`, and nginx aborts
    # the cycle with a 500 -- while /healthz keeps answering 200, so the
    # container still reports healthy and a roll proceeds against a dashboard
    # that serves nothing. That is exactly what happened on this harness's
    # first run.
    root /usr/share/nginx/html;
    index index.html;

    # Same reason as the real file: nginx resolves an upstream name once at
    # parse time, so a rolled `web` generation would otherwise leave this
    # container holding dead IPs. The rehearsal's zero-downtime probe would
    # then fail for a reason that has nothing to do with the rollout scripts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream http://web:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /media/ {
        set $media_upstream http://media:80;
        proxy_pass $media_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    # The SPA. `add_header ... always` so the release marker is present on the
    # 200 the zero-downtime probe reads, which is how the rehearsal tells one
    # generation from the other.
    location / {
        add_header X-E2E-Release $e2e_release always;
        try_files $uri $uri/ /index.html;
    }
}
