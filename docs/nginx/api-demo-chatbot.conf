# Host nginx vhost for the chatbot API. Reference copy -- the live file is
# /etc/nginx/sites-available/api-demo-chatbot.abdulkhalek.dev. CD cannot
# deploy it: it lives outside DEPLOY_PATH and is root-owned. Keep the two
# copies in sync by hand.
#
# This file ships the :80 server block ONLY. `certbot --nginx` creates the
# :443 block, fills in the ssl_certificate lines, and rewrites the redirect
# below. Do not ship a `listen 443 ssl` block with the certificate lines
# commented out: nginx rejects the whole configuration with
#   [emerg] no "ssl_certificate" is defined for the "listen ... ssl" directive
# and once the symlink is live in sites-enabled/, that failure takes nginx
# down on the next restart -- :80 and :443 for EVERY site on this host, not
# just this one. certbot cannot rescue it either, because certbot runs
# `nginx -t` itself before touching anything.
#
# After certbot has run, copy the reference block at the bottom of this file
# into the :443 server it generated. Those settings are load-bearing and
# certbot does not create them.

server {
    listen 80;
    listen [::]:80;
    server_name api-demo-chatbot.abdulkhalek.dev;

    # certbot's HTTP-01 challenge, for the first issuance and every renewal.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # The redirect lives in `location /`, NOT at server level: a server-level
    # `return 301` runs in the rewrite phase, which precedes location
    # matching, so it would swallow the ACME challenge above and every
    # certificate renewal would fail.
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# REFERENCE -- add all of the following to the `server { listen 443 ssl; ... }`
# block that `certbot --nginx` generates, then `nginx -t && systemctl reload
# nginx`. certbot supplies the listen/ssl_certificate/server_name lines; it
# supplies none of these, and without them the API breaks in ways that look
# like application bugs.
#
#     # Matches the dashboard's internal nginx. Knowledge-base document
#     # uploads are the reason: nginx's 1m default rejects them with 413 and
#     # the error never reaches the application, so it looks like a client bug.
#     client_max_body_size 25M;
#
#     # RAG and LLM calls run long. The dashboard's internal nginx allows 120s
#     # for /api/; a shorter timeout here truncates the same request one hop
#     # earlier and returns 504.
#     proxy_read_timeout 120s;
#     proxy_send_timeout 120s;
#
#     # Deliberately NO Strict-Transport-Security here. Traefik's
#     # secure-headers middleware sets it -- but only because that middleware
#     # carries `forceSTSHeader: true` (traefik/dynamic/middlewares.yml).
#     # Traefik emits STS only for requests it considers TLS, and on this
#     # topology TLS terminates here in nginx, so every request Traefik sees
#     # is plain http. If forceSTSHeader is ever removed, HSTS silently
#     # disappears from every route and this vhost must take it over with:
#     #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     location / {
#         proxy_pass http://127.0.0.1:8081;
#         proxy_http_version 1.1;
#
#         proxy_set_header Host              $host;
#         # Traefik's rate limiters key tenant identity off X-Forwarded-For via
#         # ipStrategy.excludedIPs (see traefik/dynamic/middlewares.yml).
#         # $proxy_add_x_forwarded_for APPENDS the real peer rather than
#         # replacing the header, so a client sending its own X-Forwarded-For
#         # cannot displace the true address.
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto https;
#         proxy_set_header X-Real-IP         $remote_addr;
#     }
