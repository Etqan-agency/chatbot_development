# Host nginx vhost for the chatbot dashboard. Reference copy -- the live file is
# /etc/nginx/sites-available/app.chatbot-demo.etqanbackend.tech. CD cannot
# deploy it: it lives outside DEPLOY_PATH and is root-owned. Keep the two
# copies in sync by hand.
#
# INSTALL IN TWO PHASES. Symlink this file with the :443 block still commented
# out, obtain the certificate, then uncomment. The order is not optional:
#
#   1. ln -s this file into sites-enabled/, `nginx -t`, reload.
#      Only the :80 block is active. A `listen 443 ssl` block whose
#      ssl_certificate lines point at a certificate that does not exist yet is
#      rejected outright --
#        [emerg] no "ssl_certificate" is defined for the "listen ... ssl" directive
#      -- and once the symlink is live, that failure takes nginx down on the
#      next restart: :80 and :443 for EVERY site on this host. certbot cannot
#      rescue it either, because certbot runs `nginx -t` itself.
#
#   2. certbot certonly --webroot -w /var/www/html -d app.chatbot-demo.etqanbackend.tech
#      `certonly --webroot` deliberately, NOT `--nginx`. The nginx plugin does
#      not create a second server block -- with only a :80 server present it
#      APPENDS `listen 443 ssl` to that same block, so the redirect in
#      `location /` below starts applying to https as well and every https
#      request 301s to itself. Measured, not theorised. `certonly --webroot`
#      writes no nginx config at all and answers the challenge through the
#      ACME location below.
#
#   3. Uncomment the :443 block, `nginx -t`, reload.
#
# NO IPv6 LISTENERS, DELIBERATELY. These hostnames have no AAAA records, so a
# `listen [::]:80` here serves nothing -- and it is actively harmful on a
# shared host. nginx picks the FIRST server block on an address:port as that
# address's default server, and sites-enabled/ is read in alphabetical order:
# `app-chatbot-demo...` sorts ahead of most things. Add an IPv6 listener here
# while a co-hosted site's vhost is IPv4-only, and every IPv6 request for THAT
# site lands in this block instead. Its ACME challenges then return 404, and
# because 404 is a valid HTTP response Let's Encrypt does not retry over IPv4
# -- the co-hosted site's certificate silently stops renewing, and nobody finds
# out until it expires. This happened here: it broke etqanbackend.tech's
# renewal, and `nginx -t` had nothing to say about it.
#
# If these hostnames ever gain AAAA records, add `listen [::]:80` here AND to
# every other vhost on the host at the same time, then run
# `certbot renew --dry-run` for EVERY certificate before walking away.
#
# NO `default_server` ON :443 EITHER, and that is not the same statement as the
# IPv6 one above. The default-server rule applies per address:port: the first
# block listening on an address becomes what nginx serves for any request whose
# Host matches no server_name -- and by the alphabetical argument above, this
# file's :443 block may well be first on 0.0.0.0:443. That is tolerable and
# unavoidable here, but it means an https request for a co-hosted site whose
# vhost is missing or misnamed is answered by THIS block, under THIS
# certificate, rather than refused. It does not affect ACME (challenges are
# HTTP-01 on :80 and always carry a matching Host), so it cannot break renewal
# the way the IPv6 listener did. If it ever needs pinning down, give the
# intended catch-all vhost an explicit `listen 443 ssl default_server` rather
# than relying on filename order.
#
# Renewal needs no further action: certbot's systemd timer reuses the webroot
# authenticator recorded in /etc/letsencrypt/renewal/app.chatbot-demo.etqanbackend.tech.conf,
# and the ACME location below stays live for it.

server {
    listen 80;
    # NO `listen [::]:80` -- see the IPv6 warning in the header.
    server_name app.chatbot-demo.etqanbackend.tech;

    # certbot's HTTP-01 challenge, for the first issuance and every renewal.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # The redirect lives in `location /`, NOT at server level: a server-level
    # `return 301` runs in the rewrite phase, which precedes location matching,
    # so it would swallow the ACME challenge above and every renewal would fail.
    location / { return 301 https://$host$request_uri; }
}

